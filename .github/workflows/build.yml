name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']        # a tag like v1.12 also publishes a release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0    # needed for the changelog

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NAPTAP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "NAPTAP_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing key in secrets: using the debug key."
          fi

      - name: Build
        env:
          NAPTAP_KEYSTORE_PASSWORD: ${{ secrets.NAPTAP_KEYSTORE_PASSWORD }}
          NAPTAP_KEY_ALIAS: ${{ secrets.NAPTAP_KEY_ALIAS }}
          NAPTAP_KEY_PASSWORD: ${{ secrets.NAPTAP_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Tap2Nap-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Changelog: commit messages since the previous tag
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..$GITHUB_REF_NAME"; else RANGE="$GITHUB_REF_NAME"; fi
          git log "$RANGE" --no-merges --pretty="- %s" > notes.md
          gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/*.apk \
            --title "Tap2Nap ${GITHUB_REF_NAME}" --notes-file notes.md
